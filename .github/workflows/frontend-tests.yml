name: Frontend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: altcare
          POSTGRES_PASSWORD: altcare123
          POSTGRES_DB: altcare_dev
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://altcare:altcare123@localhost:5432/altcare_dev
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci-only
      INTEGRATION_ENCRYPTION_KEY: 7_xWwRUfL4F2A5fVbA2Jf4fpWM0gR5xJvDzDMegbe7I=
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install backend dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install pgvector extension
      env:
        PGPASSWORD: altcare123
      run: |
        psql -h localhost -U altcare -d altcare_dev -c "CREATE EXTENSION IF NOT EXISTS vector;"

    - name: Run migrations
      working-directory: ./backend
      run: alembic upgrade head

    - name: Seed the database
      working-directory: ./backend
      # scripts/run_seed.sh assumes a local venv (dev convenience); CI
      # installs backend deps straight onto the runner's Python instead.
      run: python scripts/seed.py

    - name: Start backend
      working-directory: ./backend
      run: |
        nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
        for i in $(seq 1 30); do
          curl -sf http://localhost:8000/health && exit 0
          sleep 1
        done
        echo "Backend failed to start"
        cat /tmp/backend.log
        exit 1

    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Type check
      working-directory: ./frontend
      run: npx tsc --noEmit

    - name: Lint
      working-directory: ./frontend
      run: npm run lint

    - name: Install Playwright browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium

    - name: Run Playwright smoke test
      working-directory: ./frontend
      env:
        CI: true
      run: npx playwright test

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 14

    - name: Dump backend log on failure
      if: failure()
      run: cat /tmp/backend.log || true
