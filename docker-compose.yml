services:
  # PostgreSQL 16 with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: altcare_postgres
    environment:
      POSTGRES_USER: altcare
      POSTGRES_PASSWORD: altcare123
      POSTGRES_DB: altcare_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U altcare" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (cache + Celery broker)
  redis:
    image: redis:7-alpine
    container_name: altcare_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: altcare_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
  # FastAPI Backend (development)
  # Uncomment when ready to run backend in Docker
  # api:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: altcare_api
  #   environment:
  #     - DATABASE_URL=postgresql+asyncpg://altcare:altcare123@postgres:5432/altcare_dev
  #     - REDIS_URL=redis://redis:6379/0
  #     - MINIO_ENDPOINT=minio:9000
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./backend:/app
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     minio:
  #       condition: service_healthy
  #   command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: altcare_network
