  # Uncomment when ready to run backend in Docker
  # api:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: altcare_api
  #   environment:
  #     # ⚠️ SECURITY: Use environment variables for credentials, never hardcode!
  #     - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://altcare:altcare123@host.docker.internal:5432/altcare_dev}
  #     - REDIS_URL=redis://redis:6379/0
  #     - MINIO_ENDPOINT=minio:9000
  #     - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
  #     - INTEGRATION_ENCRYPTION_KEY=${INTEGRATION_ENCRYPTION_KEY:?INTEGRATION_ENCRYPTION_KEY is required}
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./backend:/app
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #     minio:
  #       condition: service_healthy
  #   command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  redis_data:
  minio_data:

networks:
  default:
    name: altcare_network
